[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "axion-haloscope"
version = "0.1.0"
description = "Axion haloscope analysis pipeline"
readme = "README.md"
authors = [
  { name = "Elena Gramellini", email = "elena.gramellini@manchester.ac.uk" }
]
license = { text = "MIT" }
requires-python = ">=3.9"
dependencies = [
  "black==25.9.0",
  "click==8.1.8",
  "contourpy==1.3.0",
  "cycler==0.12.1",
  "exceptiongroup==1.3.2",
  "fonttools==4.60.2",
  "h5py==3.14.0",
  "importlib_resources==6.5.2",
  "iniconfig==2.1.0",
  "kiwisolver==1.4.7",
  "librt==0.16.0",
  "matplotlib==3.9.4",
  "mypy==1.19.1",
  "mypy_extensions==1.1.0",
  "numpy==2.0.2",
  "packaging==25.0",
  "pandas==2.3.3",
  "pathspec==1.1.1",
  "pillow==11.3.0",
  "pip==26.0.1",
  "platformdirs==4.4.0",
  "pluggy==1.6.0",
  "Pygments==2.21.0",
  "pymupdf-fonts==1.0.5",
  "pyparsing==3.2.3",
  "pytest==8.4.2",
  "python-dateutil==3.0.0",
  "pytokens=-0.1.10",
  "pytz==2026.6",
  "PyYAML==6.0.3",
  "scipy==1.13.1",
  "setuptools==53.0.0",
  "six==1.17.0",
  "tabulate==0.9.0",
  "tomli==2.5.0",
  "tqdm==4.70.1",
  "typing_extensions==4.16.0",
  "tzdata==2026.6",
  "zipp==3.23.1"
]

[project.optional-dependencies]
dev = ["pytest", "black", "mypy"]

[project.scripts]
axion-haloscope = "axion_haloscope.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["axion_haloscope*"]


[tool.pytest.ini_options]
testpaths = ["tests"]                 # list of dirs
python_files = ["test_*.py"]          # list of patterns
python_functions = ["test_*"]         # list of patterns
